[project]
name = "waddle"
version = "0.1.0"
description = "Native desktop shell for AI CLI agents (Codex, Qwen)"
requires-python = ">=3.9"
dependencies = [
  "typer[all]>=0.7",
  "httpx>=0.24",
  "python-dotenv>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12.0",
  "pydantic>=2.6"
]

[project.scripts]
waddle = "cli_harness.native_app:main"
waddle-server = "waddle.api.server:start"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
